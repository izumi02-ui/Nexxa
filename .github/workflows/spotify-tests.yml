name: NEXXA Spotify Tests

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "backend/app/providers/spotify/**"
      - "backend/app/providers/types.py"
      - "backend/app/providers/base.py"
      - "backend/tests/test_spotify_*.py"
      - "backend/requirements.txt"
      - ".github/workflows/spotify-tests.yml"

  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "backend/app/providers/spotify/**"
      - "backend/app/providers/types.py"
      - "backend/app/providers/base.py"
      - "backend/tests/test_spotify_*.py"
      - "backend/requirements.txt"
      - ".github/workflows/spotify-tests.yml"

  workflow_dispatch:

jobs:
  spotify-tests:
    name: Spotify Provider Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Spotify provider tests
        run: python -m pytest -q tests/test_spotify_provider.py

      - name: Run Spotify client tests
        run: python -m pytest -q tests/test_spotify_client.py
