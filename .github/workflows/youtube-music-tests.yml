name: NEXXA YouTube Music Tests

on:
  push:
    paths:
      - "backend/app/providers/youtube_music/**"
      - "backend/app/providers/base.py"
      - "backend/app/providers/types.py"
      - "backend/app/config.py"
      - "backend/tests/test_youtube_music_client.py"
      - "backend/tests/test_youtube_music_provider.py"
      - "backend/tests/test_youtube_music_factory.py"
      - "backend/requirements.txt"
      - ".github/workflows/youtube-music-tests.yml"
  pull_request:
    paths:
      - "backend/app/providers/youtube_music/**"
      - "backend/app/providers/base.py"
      - "backend/app/providers/types.py"
      - "backend/app/config.py"
      - "backend/tests/test_youtube_music_client.py"
      - "backend/tests/test_youtube_music_provider.py"
      - "backend/tests/test_youtube_music_factory.py"
      - "backend/requirements.txt"
      - ".github/workflows/youtube-music-tests.yml"

jobs:
  youtube-music-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run YouTube Music tests
        run: |
          python -m pytest -q \
            tests/test_youtube_music_client.py \
            tests/test_youtube_music_provider.py \
            tests/test_youtube_music_factory.py
