name: NEXXA YouTube Tests

on:
  push:
    paths:
      - "backend/app/providers/youtube/**"
      - "backend/app/providers/base.py"
      - "backend/app/providers/types.py"
      - "backend/app/config.py"
      - "backend/tests/test_youtube_client.py"
      - "backend/tests/test_youtube_provider.py"
      - "backend/tests/test_youtube_factory.py"
      - "backend/requirements.txt"
      - ".github/workflows/youtube-tests.yml"

  pull_request:
    paths:
      - "backend/app/providers/youtube/**"
      - "backend/app/providers/base.py"
      - "backend/app/providers/types.py"
      - "backend/app/config.py"
      - "backend/tests/test_youtube_client.py"
      - "backend/tests/test_youtube_provider.py"
      - "backend/tests/test_youtube_factory.py"
      - "backend/requirements.txt"
      - ".github/workflows/youtube-tests.yml"

  workflow_dispatch:

jobs:
  youtube-tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/nexxa_test
      AUTH_SECRET_KEY: test-secret-key-for-github-actions-32-chars

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run YouTube tests
        run: |
          python -m pytest -q \
            tests/test_youtube_client.py \
            tests/test_youtube_provider.py \
            tests/test_youtube_factory.py
