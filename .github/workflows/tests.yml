name: NEXXA Tests

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/nexxa_test
      AUTH_SECRET_KEY: test-secret-key-for-github-actions-32-chars

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
